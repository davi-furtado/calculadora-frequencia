<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Frequência</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
  </head>

  <body>
    <main class="container">
      <section class="card">
        <header>
          <h1>Calculadora de Frequência</h1>
          <p>Descubra sua porcentagem de faltas e quanto ainda pode faltar.</p>
        </header>

        <form id="formulario">
          <div class="campo">
            <label for="faltadas">Aulas faltadas</label>
            <input type="number" id="faltadas" min="0" step="1" required>
          </div>
          
          <div class="campo">
            <label for="dadas">Aulas dadas</label>
            <input type="number" id="dadas" min="1" step="1" placeholder="Opcional">
          </div>

          <div class="campo">
            <label for="totais">Aulas totais</label>
            <input type="number" id="totais" min="1" step="1" placeholder="Opcional">
          </div>

          <p class="ajuda">Informe pelo menos "Aulas dadas" ou "Aulas totais".</p>
          <div class="campo">
            <label for="maxFaltas">Porcentagem máxima de faltas</label>
            <div class="input-porcentagem">
              <input type="number" id="maxFaltas" min="0" max="100" step="0.01" value="25" required>
              <span>%</span>
            </div>
          </div>
          
          <button type="submit">Calcular</button>
        </form>
        
        <output id="resultado" class="resultado" aria-live="polite"></output>
      </section>
    </main>
  </body>
</html>
